name: Build firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cai cong cu
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential libusb-1.0-0-dev pkg-config python3

      - name: Lay Pico SDK 2.x (kem submodule TinyUSB)
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          git -C $HOME/pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Build
        run: |
          cmake -S firmware -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_SDK_PATH=$HOME/pico-sdk
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: usb_pcm54-uf2
          path: build/*.uf2
          if-no-files-found: error
